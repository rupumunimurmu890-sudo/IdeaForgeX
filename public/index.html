<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4c1d95">

<title>IdeaForge-AI - AI Tools for Everyone</title>
<meta name="description" content="IdeaForge-AI — one AI hub for business ideas, writing, translation, calculations and more.">

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topBar">
    <div class="brand">
      <span class="brandMark">💡</span>
      <div>
        <div class="brandName">IdeaForge-AI</div>
        <div class="brandTag">AI Tools for Everyone</div>
      </div>
    </div>
  </header>

  <main class="layout">

    <!-- ================= HUB: Auto-ask + Categories ================= -->
    <section class="panel hubPanel">

      <label for="hubInput" class="fieldLabel">✨ आप क्या करना चाहते हैं? (What do you want to do?)</label>
      <textarea id="hubInput" placeholder="Example: मेरे लिए बैंक में देने की application लिखो / Translate this to English / ₹800 प्रति घंटे के हिसाब से 2 घंटे 35 मिनट का हिसाब करो" maxlength="3000"></textarea>

      <button type="button" id="hubAskBtn" class="primaryBtn">➤ Ask AI</button>

      <div class="hubCategories" id="hubCategories">
        <button type="button" class="hubChip" data-tool="assistant">🤖 AI Assistant</button>
        <button type="button" class="hubChip" data-tool="writing">✍️ Writing</button>
        <button type="button" class="hubChip" data-tool="translate">🌐 Translate</button>
        <button type="button" class="hubChip" data-tool="calculator">🧮 Calculator</button>
        <button type="button" class="hubChip" data-scroll="businessSection">💼 Business</button>
        <button type="button" class="hubChip" data-tool="student">📚 Student</button>
        <button type="button" class="hubChip" data-external="https://statuscraft-ai.rupumunimurmu890.workers.dev">🎨 Status</button>
        <button type="button" class="hubChip" data-external="https://admakerai-new.rupumunimurmu890.workers.dev">📢 Advertisement</button>
        <button type="button" class="hubChip" data-soon="true">📸 Image Tools</button>
        <button type="button" class="hubChip" data-soon="true">🎤 Voice AI</button>
      </div>

      <!-- Generic tool workspace — Writing/Translate/Calculator/Student/Assistant -->
      <div id="toolWorkspace" class="toolWorkspace" style="display:none;">

        <div id="toolWorkspaceTitle" class="subReportTitle">🤖 AI Assistant</div>

        <div id="writingOptions" class="toolExtraFields" style="display:none;">
          <select id="writingTypeSelect">
            <option value="">Type: General</option>
            <option value="WhatsApp Message">WhatsApp Message</option>
            <option value="Application">Application</option>
            <option value="Letter">Letter</option>
            <option value="Email">Email</option>
            <option value="Caption">Caption</option>
            <option value="YouTube Description">YouTube Description</option>
            <option value="Instagram Caption">Instagram Caption</option>
            <option value="Speech">Speech</option>
            <option value="Story">Story</option>
            <option value="Shayari">Shayari</option>
            <option value="Business Description">Business Description</option>
          </select>
          <select id="toneSelect">
            <option value="">Tone: Simple</option>
            <option value="Professional">Professional</option>
            <option value="Friendly">Friendly</option>
            <option value="Emotional">Emotional</option>
          </select>
        </div>

        <div id="translateOptions" class="toolExtraFields" style="display:none;">
          <select id="fromLanguageSelect">
            <option value="auto">Detect Language</option>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Bengali">Bengali</option>
            <option value="Tamil">Tamil</option>
            <option value="Telugu">Telugu</option>
            <option value="Marathi">Marathi</option>
            <option value="Gujarati">Gujarati</option>
            <option value="Punjabi">Punjabi</option>
            <option value="Urdu">Urdu</option>
          </select>
          <span class="swapArrow">→</span>
          <select id="toLanguageSelect">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Bengali">Bengali</option>
            <option value="Tamil">Tamil</option>
            <option value="Telugu">Telugu</option>
            <option value="Marathi">Marathi</option>
            <option value="Gujarati">Gujarati</option>
            <option value="Punjabi">Punjabi</option>
            <option value="Urdu">Urdu</option>
          </select>
        </div>

        <textarea id="toolInput" placeholder="Type your request here..." maxlength="3000"></textarea>

        <button type="button" id="toolGenerateBtn" class="primaryBtn">✨ Generate</button>

        <div id="toolResult" class="toolResultBox" style="display:none;"></div>

        <div id="toolResultActions" class="reportActions" style="display:none;">
          <button type="button" id="toolCopyBtn" class="actionBtn">📋 Copy</button>
          <button type="button" id="toolShareBtn" class="actionBtn">📤 Share</button>
        </div>

      </div>

    </section>

    <section id="businessSection">

    <section class="panel inputPanel">

      <label for="ideaInput" class="fieldLabel">✨ Describe your business idea</label>
      <textarea id="ideaInput" placeholder="Example: I want to start a home-based tiffin service for office workers in my city..." maxlength="2000"></textarea>
      <div class="charCount"><span id="charCount">0</span> / 2000</div>

      <label for="languageSelect" class="fieldLabel">🌐 Language</label>
      <select id="languageSelect">
        <option value="auto">Auto Detect</option>
        <option value="English">English</option>
        <option value="Hindi">Hindi (हिन्दी)</option>
        <option value="Hinglish">Hinglish</option>
        <option value="Bengali">Bengali</option>
        <option value="Marathi">Marathi</option>
        <option value="Gujarati">Gujarati</option>
        <option value="Punjabi">Punjabi</option>
        <option value="Tamil">Tamil</option>
        <option value="Telugu">Telugu</option>
        <option value="Kannada">Kannada</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="Arabic">Arabic</option>
        <option value="Portuguese">Portuguese</option>
        <option value="German">German</option>
        <option value="Chinese">Chinese</option>
        <option value="Japanese">Japanese</option>
        <option value="Korean">Korean</option>
        <option value="Russian">Russian</option>
      </select>

      <label for="budgetInput" class="fieldLabel">💰 Your Starting Budget (optional, for Launch Plan)</label>
      <input type="text" id="budgetInput" placeholder="Example: ₹50,000">

      <button type="button" id="generateBtn" class="primaryBtn">
        🚀 Generate Complete Startup Report
      </button>

      <div id="ideaHistorySection" class="ideaHistorySection" style="display:none;">
        <div class="historyLabel">🕘 My Recent Ideas</div>
        <div id="ideaHistoryRow" class="ideaHistoryRow"></div>
      </div>

    </section>

    <section id="reportSection" class="panel reportPanel" style="display:none;">

      <div class="scoreOverall">
        <div class="scoreOverallNumber" id="scoreOverall">--</div>
        <div class="scoreOverallLabel">Overall Idea Score</div>
      </div>

      <div class="scoreGrid">
        <div class="scoreCard">
          <div class="scoreCardLabel">📊 Market Demand</div>
          <div class="scoreBar"><div class="scoreBarFill" id="barMarket"></div></div>
          <div class="scoreCardValue" id="valMarket">--/100</div>
        </div>
        <div class="scoreCard">
          <div class="scoreCardLabel">🥊 Low Competition</div>
          <div class="scoreBar"><div class="scoreBarFill" id="barCompetition"></div></div>
          <div class="scoreCardValue" id="valCompetition">--/100</div>
        </div>
        <div class="scoreCard">
          <div class="scoreCardLabel">💰 Profit Potential</div>
          <div class="scoreBar"><div class="scoreBarFill" id="barProfit"></div></div>
          <div class="scoreCardValue" id="valProfit">--/100</div>
        </div>
        <div class="scoreCard">
          <div class="scoreCardLabel">🟢 Ease to Start</div>
          <div class="scoreBar"><div class="scoreBarFill" id="barDifficulty"></div></div>
          <div class="scoreCardValue" id="valDifficulty">--/100</div>
        </div>
      </div>

      <div class="reportSections" id="reportSections"></div>

      <div class="reportActions">
        <button type="button" id="downloadPdfBtn" class="actionBtn">📄 Download PDF</button>
        <button type="button" id="copyReportBtn" class="actionBtn">📋 Copy Full Report</button>
        <button type="button" id="shareReportBtn" class="actionBtn">📤 Share</button>
        <button type="button" id="newIdeaBtn" class="actionBtn">✨ New Idea</button>
      </div>

      <div class="reportActions" style="margin-top:8px;">
        <button type="button" id="generateLaunchPlanBtn" class="actionBtn actionHighlight">🚀 Generate Launch Plan</button>
        <button type="button" id="generatePitchDeckBtn" class="actionBtn actionHighlight">🎤 Generate Pitch Deck</button>
      </div>

    </section>

    <section id="launchPlanSection" class="panel reportPanel" style="display:none;">
      <div class="subReportTitle">🚀 30-Day Launch Plan</div>
      <div class="reportSections" id="launchPlanSections"></div>
      <div class="reportActions">
        <button type="button" id="downloadLaunchPlanPdfBtn" class="actionBtn">📄 Download PDF</button>
        <button type="button" id="copyLaunchPlanBtn" class="actionBtn">📋 Copy</button>
        <button type="button" id="shareLaunchPlanBtn" class="actionBtn">📤 Share</button>
      </div>
    </section>

    <section id="pitchDeckSection" class="panel reportPanel" style="display:none;">
      <div class="subReportTitle">🎤 Investor Pitch Deck</div>
      <div class="pitchDeckSlides" id="pitchDeckSlides"></div>
      <div class="reportActions">
        <button type="button" id="downloadPitchDeckPdfBtn" class="actionBtn">📄 Download PDF</button>
        <button type="button" id="copyPitchDeckBtn" class="actionBtn">📋 Copy</button>
        <button type="button" id="sharePitchDeckBtn" class="actionBtn">📤 Share</button>
      </div>
    </section>

    </section>

  </main>

  <p class="footer">💡 IdeaForge-AI &nbsp;·&nbsp; © 2026</p>

  <div id="toastContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>

  <!-- Cloudflare Web Analytics -->
  <script defer type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fca44a86c9444b27bad73247f4dc4e1c"}'></script>
  <!-- End Cloudflare Web Analytics -->

</body>
</html>
