  <style>

:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#141821; --muted:#5b6474; --line:#dfe3ea;

  margin:0; background:var(--bg); color:var(--ink);

}

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
const opt = (v, t) => h('option', { value: v }, t);
const field = (label, ...ctl) => h('label', { class: 'field' }, h('span', { class: 'lbl' }, label), h('div', { class: 'ctl' }, ...ctl));
const range = (min, max, val, step = 1) => h('input', { type: 'range', min, max, value: val, step });
const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const baseName = f => f.name.replace(/\.[^.]+$/, '');
const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
const MAXPX = 16e6;

let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = h('textarea'); ta.value = t; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copy हो गया ✓');
}
async function withBusy(btn, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ हो रहा है…';
  try { await fn(); } catch (e) { console.error(e); toast('❌ ' + (e && e.message ? e.message : 'कुछ गड़बड़ हुई')); }
  finally { btn.disabled = false; btn.textContent = old; }
}
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------- lazy libraries (CDN) ---------- */
const LIBS = {
  pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tess: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'
};
const _loaded = {};
function loadScript(src) {
  if (_loaded[src]) return _loaded[src];
  return _loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete _loaded[src]; rej(new Error('Library load नहीं हुई — internet जाँचकर फिर कोशिश करें')); };
    document.head.append(s);
  });
}
async function needPdfLib() { await loadScript(LIBS.pdflib); return window.PDFLib; }
async function needPdfJs() { await loadScript(LIBS.pdfjs); window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfjsWorker; return window.pdfjsLib; }

async function loadPdfLibDoc(file) {
  const { PDFDocument } = await needPdfLib();
  try { return await PDFDocument.load(await file.arrayBuffer()); }
  catch (e) {
    if (/encrypt/i.test(e.message)) throw new Error('यह PDF password-protected है, इसे पहले unlock करना होगा');
    throw new Error('यह PDF खुल नहीं पा रही (file खराब हो सकती है)');
  }
}
async function openPdfJs(file) {
  const lib = await needPdfJs();
  try { return await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (e) {
    if (e && e.name === 'PasswordException') throw new Error('यह PDF password-protected है');
    throw new Error('यह PDF खुल नहीं पा रही');
  }
}
async function renderPage(pdf, n, scale) {
  const page = await pdf.getPage(n);
  let vp = page.getViewport({ scale });
  if (vp.width * vp.height > MAXPX) vp = page.getViewport({ scale: scale * Math.sqrt(MAXPX / (vp.width * vp.height)) });
  const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return c;
}

/* ---------- images ---------- */
function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), i = new Image();
    i.onload = () => res(i); i.onerror = () => rej(new Error('Image खुल नहीं पाई: ' + file.name)); i.src = url;
  });
}
function drawScaled(img, maxSide = 0, bg = null) {
  let w = img.naturalWidth, hh = img.naturalHeight;
  if (maxSide && Math.max(w, hh) > maxSide) { const s = maxSide / Math.max(w, hh); w = Math.round(w * s); hh = Math.round(hh * s); }
  if (w * hh > MAXPX) { const s = Math.sqrt(MAXPX / (w * hh)); w = Math.floor(w * s); hh = Math.floor(hh * s); }
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  const x = c.getContext('2d'); if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, hh); }
  x.drawImage(img, 0, 0, w, hh); return c;
}
async function canvasOut(c, mime, q, base) {
  const blob = await new Promise(r => c.toBlob(r, mime, q));
  if (!blob) throw new Error('Image export नहीं हो पाई');
  return { blob, name: base + '.' + (EXT[blob.type] || 'png') };
}

/* ---------- UI pieces ---------- */
function picker({ accept, multiple, label, hint, onFiles }) {
  const ok = f => accept.split(',').some(a => {
    a = a.trim();
    return a.endsWith('/*') ? f.type.startsWith(a.slice(0, -1)) : a.startsWith('.') ? f.name.toLowerCase().endsWith(a) : f.type === a;
  });
  const input = h('input', { type: 'file', accept, multiple: !!multiple, hidden: true });
  const zone = h('div', { class: 'drop', tabindex: '0', role: 'button' }, h('div', { class: 'big' }, '📂'), h('div', {}, label || 'File चुनें'), h('small', {}, hint || ''));
  const handle = fs => {
    fs = fs.filter(ok);
    if (!fs.length) return toast('सही type की file चुनें');
    onFiles(multiple ? fs : [fs[0]]);
  };
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); handle([...e.dataTransfer.files]); });
  input.addEventListener('change', () => { handle([...input.files]); input.value = ''; });
  return h('div', {}, zone, input);
}
function makeList(onChange) {
  const files = [], el = h('div', { class: 'files' });
  const move = (i, d) => { [files[i], files[i + d]] = [files[i + d], files[i]]; draw(); };
  function draw() {
    el.replaceChildren(...files.map((f, i) => h('div', { class: 'row' },
      h('div', { class: 'thumb ph' }, f.type.startsWith('image/') ? '🖼️' : '📄'),
      h('div', { class: 'grow' }, h('div', { class: 'nm' }, f.name), h('div', { class: 'muted' }, fmt(f.size))),
      h('button', { class: 'ic', title: 'ऊपर', disabled: i === 0, onclick: () => move(i, -1) }, '↑'),
      h('button', { class: 'ic', title: 'नीचे', disabled: i === files.length - 1, onclick: () => move(i, 1) }, '↓'),
      h('button', { class: 'ic', title: 'हटाएँ', onclick: () => { files.splice(i, 1); draw(); } }, '✕'))));
    onChange && onChange(files.length);
  }
  return { el, files, add(fs) { files.push(...fs); draw(); }, clear() { files.length = 0; draw(); } };
}
function resultRow({ blob, name, note }) {
  const isImg = blob.type.startsWith('image/');
  return h('div', { class: 'row' },
    isImg ? h('img', { class: 'thumb', src: URL.createObjectURL(blob), alt: '' }) : h('div', { class: 'thumb ph' }, blob.type === 'application/pdf' ? '📄' : '📝'),
    h('div', { class: 'grow' }, h('div', { class: 'nm' }, name), h('div', { class: 'muted' }, fmt(blob.size) + (note ? ' · ' + note : ''))),
    h('button', { class: 'btn small', onclick: () => download(blob, name) }, '⬇ Save'));
}
function panel(title, desc, ...kids) { return h('section', { class: 'panel' }, h('h2', {}, title), h('p', { class: 'd' }, desc), ...kids); }
const pdfBlob = bytes => new Blob([bytes], { type: 'application/pdf' });

function parseRange(str, total) {
  const out = new Set();
  for (const part of str.split(',').map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d*)\s*-\s*(\d*)$/);
    if (m && (m[1] || m[2])) {
      let a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : total; if (a > b) [a, b] = [b, a];
      for (let i = Math.max(1, a); i <= Math.min(total, b); i++) out.add(i);
    } else if (/^\d+$/.test(part)) { const n = +part; if (n >= 1 && n <= total) out.add(n); }
    else throw new Error('Page range गलत है: ' + part);
  }
  return [...out].sort((a, b) => a - b);
}

/* ================= PDF TOOLS ================= */
function toolMerge(root) {
  const out = h('div', { class: 'results' });
  const btn = h('button', { class: 'btn primary', disabled: true }, 'PDF जोड़ें');
  const L = makeList(n => { btn.disabled = n < 2; });
  const pick = picker({ accept: 'application/pdf,.pdf', multiple: true, label: 'PDF चुनें', hint: 'कई PDF एक साथ चुन सकते हैं, ↑↓ से क्रम बदलें', onFiles: fs => L.add(fs) });
  btn.onclick = () => withBusy(btn, async () => {
    const { PDFDocument } = await needPdfLib(); const doc = await PDFDocument.create();
    for (const f of L.files) {
      const src = await loadPdfLibDoc(f);
      (await doc.copyPages(src, src.getPageIndices())).forEach(p => doc.addPage(p));
    }
    out.replaceChildren(resultRow({ blob: pdfBlob(await doc.save()), name: 'merged.pdf', note: doc.getPageCount() + ' pages' }));
  });
  root.append(panel('Merge PDF', 'कई PDF को एक file में जोड़ें।', pick, L.el, btn, out));
}

function toolPages(root, mode) {
  let file = null, total = 0;
  const info = h('div', { class: 'muted', style: 'margin-top:10px' });
  const rng = h('input', { type: 'text', placeholder: mode === 'extract' ? 'जैसे 1-3, 5, 8-' : 'जैसे 2, 4-6', autocomplete: 'off' });
  const out = h('div', { class: 'results' });
  const btn = h('button', { class: 'btn primary', disabled: true }, mode === 'extract' ? 'Pages निकालें' : 'Pages हटाएँ');
  const pick = picker({
    accept: 'application/pdf,.pdf', label: 'PDF चुनें', onFiles: async ([f]) => {
      try { const d = await loadPdfLibDoc(f); file = f; total = d.getPageCount(); info.textContent = `${f.name} · ${total} pages · ${fmt(f.size)}`; btn.disabled = false; out.replaceChildren(); }
      catch (e) { toast('❌ ' + e.message); }
    }
  });
  btn.onclick = () => withBusy(btn, async () => {
    const sel = parseRange(rng.value, total); if (!sel.length) throw new Error('Page number लिखें (1 से ' + total + ' के बीच)');
    const { PDFDocument } = await needPdfLib(); const src = await PDFDocument.load(await file.arrayBuffer());
    const keep = mode === 'extract' ? sel : src.getPageIndices().map(i => i + 1).filter(p => !sel.includes(p));
    if (!keep.length) throw new Error('सारे pages हट जाएँगे, कुछ तो बचाएँ');
    const doc = await PDFDocument.create();
    (await doc.copyPages(src, keep.map(p => p - 1))).forEach(p => doc.addPage(p));
    out.replaceChildren(resultRow({ blob: pdfBlob(await doc.save()), name: baseName(file) + (mode === 'extract' ? '-split.pdf' : '-edited.pdf'), note: keep.length + ' pages' }));
  });
  const t = mode === 'extract' ? ['Split PDF', 'PDF से चुने हुए pages अलग file में निकालें।'] : ['Remove PDF pages', 'PDF से गैर-ज़रूरी pages हटाएँ।'];
  root.append(panel(t[0], t[1], pick, info, field(mode === 'extract' ? 'कौन से pages चाहिए' : 'कौन से pages हटाने हैं', rng), btn, out));
}

function toolRotate(root) {
  let file = null, total = 0;
  const info = h('div', { class: 'muted', style: 'margin-top:10px' });
  const ang = h('select', {}, opt('90', '90° दाएँ (clockwise)'), opt('180', '180° उल्टा'), opt('270', '90° बाएँ'));
  const rng = h('input', { type: 'text', placeholder: 'खाली छोड़ें = सारे pages', autocomplete: 'off' });
  const out = h('div', { class: 'results' });
  const btn = h('button', { class: 'btn primary', disabled: true }, 'Rotate करें');
  const pick = picker({

function toolSign(root) {
  let buf = null, pdf = null, total = 0, pageNo = 1, fx = 0.7, fy = 0.85, sigURL = null, sigRatio = 0.4, fileName = 'signed';
  const stage = h('div', { hidden: true });
  const wrap = h('div', { class: 'pagewrap' });
  const ov = h('img', { class: 'sigov', alt: '', hidden: true });
  const pageInp = h('input', { type: 'number', min: '1', value: '1', inputmode: 'numeric' });
  const size = range(8, 60, 28); const pen = h('select', {}, opt('#111111', 'Black'), opt('#1a3fd0', 'Blue'));
  const out = h('div', { class: 'results' });
  const info = h('div', { class: 'muted', style: 'margin-top:10px' });

  function place() { ov.style.left = fx * 100 + '%'; ov.style.top = fy * 100 + '%'; ov.style.width = size.value + '%'; }
  async function showPage() {
    const w = Math.min(wrap.parentElement.clientWidth || 360, 640) * Math.min(window.devicePixelRatio || 1, 2);
    const base = (await pdf.getPage(pageNo)).getViewport({ scale: 1 });
    const c = await renderPage(pdf, pageNo, w / base.width);
    wrap.replaceChildren(c, ov); place();
  }
  const go = n => { pageNo = Math.min(Math.max(1, n || 1), total); pageInp.value = pageNo; showPage().catch(e => toast('❌ ' + e.message)); };
  wrap.addEventListener('click', e => {
    const r = wrap.getBoundingClientRect(); fx = (e.clientX - r.left) / r.width; fy = (e.clientY - r.top) / r.height; place();
  });
  size.oninput = place; pageInp.onchange = () => go(+pageInp.value);

  const pad = h('canvas', { class: 'pad', width: '640', height: '240' });
  const pctx = pad.getContext('2d'); pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  let drawing = false, last = null;
  const pos = e => { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; };
  pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); last = pos(e); pctx.strokeStyle = pen.value; pctx.lineWidth = 5; pctx.beginPath(); pctx.moveTo(...last); pctx.lineTo(last[0] + 0.01, last[1]); pctx.stroke(); });
  pad.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); pctx.strokeStyle = pen.value; pctx.lineWidth = 5; pctx.beginPath(); pctx.moveTo(...last); pctx.lineTo(...p); pctx.stroke(); last = p; });
  const end = () => { if (drawing) { drawing = false; updateSig(); } };
  pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  function updateSig() {
    const W = pad.width, H = pad.height, d = pctx.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = 0, y1 = 0, any = false;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 10) { any = true; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (!any) { sigURL = null; ov.hidden = true; return; }
    const m = 6; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
    const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
    c.getContext('2d').drawImage(pad, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    sigURL = c.toDataURL('image/png'); sigRatio = c.height / c.width; ov.src = sigURL; ov.hidden = false; place();
  }
  const clear = () => { pctx.clearRect(0, 0, pad.width, pad.height); updateSig(); };

  const btn = h('button', { class: 'btn primary' }, 'Sign करके सेव करें');
  btn.onclick = () => withBusy(btn, async () => {
    if (!sigURL) throw new Error('पहले ऊपर के box में signature बनाएँ');
    const { PDFDocument } = await needPdfLib(); const doc = await PDFDocument.load(buf);
    const page = doc.getPage(pageNo - 1);
    if (page.getRotation().angle) throw new Error('यह page rotated है। पहले Rotate PDF से सीधा करें');
    const { width: PW, height: PH } = page.getSize();
    const bin = atob(sigURL.split(',')[1]), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const png = await doc.embedPng(bytes);
    const sw = PW * size.value / 100, sh = sw * sigRatio;
    page.drawImage(png, { x: fx * PW - sw / 2, y: PH - fy * PH - sh / 2, width: sw, height: sh });
    out.replaceChildren(resultRow({ blob: pdfBlob(await doc.save()), name: fileName + '-signed.pdf', note: 'page ' + pageNo + ' पर sign' }));
  });

  const pick = picker({
    accept: 'application/pdf,.pdf', label: 'PDF चुनें', onFiles: async ([f]) => {
      try {
        buf = await f.arrayBuffer(); fileName = baseName(f);
        pdf = await openPdfJs(f); total = pdf.numPages; pageInp.max = total; info.textContent = `${f.name} · ${total} pages`;
        stage.hidden = false; out.replaceChildren(); go(1);
      } catch (e) { toast('❌ ' + e.message); }
    }
  });
  stage.append(
    h('div', { class: 'note' }, 'ऊपर वाले box में उँगली या mouse से signature बनाएँ, फिर नीचे PDF पर जहाँ चाहिए वहाँ tap करें।'),
    field('Signature बनाएँ', pen), pad,
    h('div', { class: 'pager' }, h('button', { class: 'btn small', onclick: clear }, 'Clear'), h('span', { class: 'grow' })),
    field('Signature का साइज़', size),
    h('div', { class: 'pager' }, h('button', { class: 'ic', onclick: () => go(pageNo - 1) }, '‹'), pageInp, h('span', { class: 'muted' }, 'page'), h('button', { class: 'ic', onclick: () => go(pageNo + 1) }, '›')),
    wrap, btn, out);
  root.append(panel('Sign PDF', 'PDF पर अपने हाथ का signature लगाएँ।', pick, info, stage));
}

  const btn = h('button', { class: 'btn primary' }, 'Crop करके सेव करें');
  function rect() {
    const iw = img.naturalWidth, ih = img.naturalHeight, ar = R[sel.value] || iw / ih; let cw, ch;
    if (iw / ih > ar) { ch = ih; cw = ih * ar; } else { cw = iw; ch = iw / ar; }
    const z = +zoom.value; cw /= z; ch /= z;
    return { x: (iw - cw) * px.value / 100, y: (ih - ch) * py.value / 100, w: cw, h: ch, ar };
  }
  function draw() { const r = rect(); prev.width = 480; prev.height = Math.round(480 / r.ar); prev.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, prev.width, prev.height); }
  [sel, zoom, px, py].forEach(e => e.addEventListener('input', () => img && draw()));
  btn.onclick = () => withBusy(btn, async () => {
    const r = rect(); let sw = Math.round(r.w), sh = Math.round(r.h);
    if (sel.value === 'passport') { sw = 413; sh = 531; }
    if (sw * sh > MAXPX) { const s = Math.sqrt(MAXPX / (sw * sh)); sw = Math.floor(sw * s); sh = Math.floor(sh * s); }
    const c = document.createElement('canvas'); c.width = sw; c.height = sh; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, sw, sh); x.imageSmoothingQuality = 'high'; x.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, sw, sh);
    const png = file.type === 'image/png' || sel.value === 'passport';
    const o = await canvasOut(c, png ? 'image/png' : 'image/jpeg', 0.95, baseName(file) + '-crop');
    out.replaceChildren(resultRow({ ...o, note: `${sw}×${sh} px` }));
  });
  const pick = picker({ accept: 'image/*', label: 'Image चुनें', onFiles: async ([f]) => { try { img = await loadImg(f); file = f; prev.hidden = false; stage.hidden = false; out.replaceChildren(); draw(); } catch (e) { toast('❌ ' + e.message); } } });
  stage.append(field('Shape', sel), field('Zoom', zoom), field('बाएँ ↔ दाएँ', px), field('ऊपर ↕ नीचे', py), btn, out,
    h('div', { class: 'note' }, 'Passport option में photo 413×531 px (300 dpi पर 35×45 mm) बनती है, फिर भी अपने form की ज़रूरत एक बार जाँच लें।'));
  root.append(panel('Crop Image', 'सही ratio में crop करें: Instagram, Status, Passport।', pick, prev, stage));
}

/* ================= TEXT / OCR ================= */
function toolOcr(root) {
  let file = null;
  const lang = h('select', {}, opt('eng', 'English'), opt('hin', 'हिन्दी'), opt('eng+hin', 'English + हिन्दी'), opt('ben', 'বাংলা'), opt('mar', 'मराठी'), opt('guj', 'ગુજરાતી'), opt('pan', 'ਪੰਜਾਬੀ'), opt('tam', 'தமிழ்'), opt('tel', 'తెలుగు'), opt('kan', 'ಕನ್ನಡ'), opt('mal', 'മലയാളം'), opt('urd', 'اردو'), opt('nep', 'नेपाली'));
  const info = h('div', { class: 'muted', style: 'margin-top:10px' }); const prog = h('div', { class: 'muted', style: 'margin-top:8px' });
  const ta = h('textarea', { rows: '12', placeholder: 'Text यहाँ दिखेगा' });
  const acts = h('div', { class: 'ctl', style: 'margin-top:10px', hidden: true },
    h('button', { class: 'btn small', onclick: () => copyText(ta.value) }, 'Copy'),
    h('button', { class: 'btn small', onclick: () => download(new Blob([ta.value], { type: 'text/plain;charset=utf-8' }), baseName(file) + '.txt') }, '⬇ .txt'));
  const btn = h('button', { class: 'btn primary', disabled: true }, 'Text पढ़ें');
  const pick = picker({ accept: 'image/*', label: 'Image चुनें', hint: 'फ़ोटो, screenshot या scan', onFiles: ([f]) => { file = f; info.textContent = `${f.name} · ${fmt(f.size)}`; btn.disabled = false; } });
  btn.onclick = () => withBusy(btn, async () => {
    await loadScript(LIBS.tess);
    prog.textContent = 'Language data लोड हो रहा है (पहली बार कुछ MB)…';
    const worker = await window.Tesseract.createWorker(lang.value.split('+'), 1, {
      logger: m => { if (m.status === 'recognizing text') prog.textContent = 'पढ़ा जा रहा है… ' + Math.round(m.progress * 100) + '%'; }
    });
    try {
      const { data } = await worker.recognize(file);
      ta.value = (data.text || '').trim(); acts.hidden = false;
      if (!ta.value) toast('Text नहीं मिला, साफ़ और सीधी फ़ोटो आज़माएँ');
    } finally { prog.textContent = ''; await worker.terminate(); }
  });
  root.append(panel('OCR: Image → Text', 'फ़ोटो में लिखा text पढ़कर copy करें।', pick, info, field('Image में भाषा', lang), btn, prog, h('div', { style: 'margin-top:12px' }, ta), acts,
    h('div', { class: 'note' }, 'Image आपके phone में ही पढ़ी जाती है। सिर्फ़ भाषा की data file पहली बार download होती है।')));
}

/* ================= registry + router ================= */
const TOOLS = [
  { id: 'merge', g: 'PDF', icon: '🧩', title: 'Merge PDF', desc: 'कई PDF को एक में जोड़ें', run: toolMerge },
  { id: 'split', g: 'PDF', icon: '✂️', title: 'Split PDF', desc: 'चुने हुए pages अलग file में निकालें', run: r => toolPages(r, 'extract') },
  { id: 'remove-pages', g: 'PDF', icon: '🗑️', title: 'Remove pages', desc: 'PDF से extra pages हटाएँ', run: r => toolPages(r, 'remove') },
  { id: 'rotate', g: 'PDF', icon: '🔄', title: 'Rotate PDF', desc: 'उल्टे pages सीधे करें', run: toolRotate },
  { id: 'sign', g: 'PDF', icon: '✍️', title: 'Sign PDF', desc: 'PDF पर अपना signature लगाएँ', run: toolSign },
  { id: 'compress-pdf', g: 'PDF', icon: '🗜️', title: 'Compress PDF', desc: 'PDF का साइज़ घटाएँ', run: toolCompressPdf },
  { id: 'jpg-to-pdf', g: 'PDF', icon: '🖼️', title: 'JPG → PDF', desc: 'फ़ोटो को PDF बनाएँ', run: toolJpg2Pdf },
  { id: 'pdf-to-jpg', g: 'PDF', icon: '📷', title: 'PDF → JPG', desc: 'PDF के pages को image बनाएँ', run: toolPdf2Jpg },
  { id: 'pdf-to-text', g: 'PDF', icon: '📝', title: 'PDF → Text', desc: 'PDF से text copy करें', run: toolPdf2Text },
  { id: 'image-compress', g: 'Image', icon: '📉', title: 'Image Compressor', desc: 'फ़ोटो का साइज़ घटाएँ', run: toolImgCompress },
  { id: 'image-resize', g: 'Image', icon: '📐', title: 'Resize Image', desc: 'Width/height बदलें', run: toolImgResize },
  { id: 'image-crop', g: 'Image', icon: '🔲', title: 'Crop Image', desc: 'Instagram, Status, Passport ratio', run: toolImgCrop },
  { id: 'image-convert', g: 'Image', icon: '🔁', title: 'JPG ↔ PNG ↔ WebP', desc: 'Image format बदलें', run: toolImgConvert },
  { id: 'ocr', g: 'Text', icon: '🔍', title: 'OCR: Image → Text', desc: 'फ़ोटो से text पढ़ें (हिन्दी सहित)', run: toolOcr }
];
const GROUPS = { PDF: 'PDF tools', Image: 'Image tools', Text: 'Text tools' };
const app = $('#app'), back = $('#back'), ttl = $('#ttl');

function home() {
  document.title = 'PDF & Image Tools – IdeaForge-AI'; ttl.textContent = 'PDF & Image tools';
  back.textContent = '← App'; back.setAttribute('href', '/');
  const listBox = h('div');
  const search = h('input', { type: 'text', class: 'search', placeholder: 'Tool खोजें… (merge, compress, sign)', autocomplete: 'off', 'aria-label': 'Tool खोजें' });
  const draw = () => {
    const q = search.value.trim().toLowerCase(); listBox.replaceChildren(); let n = 0;
    for (const [g, label] of Object.entries(GROUPS)) {
      const items = TOOLS.filter(t => t.g === g && (!q || (t.title + ' ' + t.desc + ' ' + t.id).toLowerCase().includes(q)));
      if (!items.length) continue; n += items.length;
      listBox.append(h('h2', {}, label), h('div', { class: 'list' }, items.map(t =>
        h('a', { class: 'tool', href: '#/' + t.id }, h('div', { class: 'ico' }, t.icon), h('div', {}, h('b', {}, t.title), h('span', {}, t.desc))))));
    }
    if (!n) listBox.append(h('div', { class: 'empty' }, 'कोई tool नहीं मिला'));
  };
  search.addEventListener('input', draw); draw();
  app.replaceChildren(h('p', { class: 'lead' }, 'आपकी files इसी phone/browser में process होती हैं, कहीं upload नहीं होतीं।'), search, listBox);
}
function openTool(t) {
  document.title = t.title + ' – IdeaForge-AI'; ttl.textContent = t.title;
  back.textContent = '← सभी tools'; back.setAttribute('href', '#/');
  const box = h('div'); app.replaceChildren(box);
  try { t.run(box); } catch (e) { console.error(e); box.append(h('div', { class: 'note' }, 'Tool खुल नहीं पाया: ' + e.message)); }
}
function route() {
  const id = location.hash.replace(/^#\/?/, ''); const t = TOOLS.find(x => x.id === id);
  window.scrollTo(0, 0); t ? openTool(t) : home();
}
window.addEventListener('hashchange', route); route();
})();
