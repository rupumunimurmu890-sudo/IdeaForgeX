<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Universal Helper</title>
  <meta name="description" content="Tell us what you need. Get help with your everyday tasks.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div class="logo">
        <span>✦</span>
        <strong>Universal Helper</strong>
      </div>

      <select id="language">
        <option value="auto">🌐 Auto</option>
        <option value="English">English</option>
        <option value="Hindi">हिंदी</option>
        <option value="Santali">Santali</option>
        <option value="Bengali">বাংলা</option>
      </select>
    </header>

    <section class="hero">
      <div class="badge">AI Daily Helper</div>

      <h1>What do you need help with?</h1>

      <p>
        Just tell us what you want to do.
        We'll help you get it done.
      </p>

      <div class="input-box">

        <textarea
          id="taskInput"
          placeholder="Example: Write a leave application for my school..."
          maxlength="5000"
        ></textarea>

        <div class="input-footer">
          <span id="charCount">0 / 5000</span>

          <button id="askButton">
            ✨ Help me
          </button>
        </div>

      </div>

      <div class="examples">
        <button class="example">Write a leave application</button>
        <button class="example">Explain this in simple language</button>
        <button class="example">Create an advertisement</button>
      </div>
    </section>

    <section id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Understanding your task...</p>
    </section>

    <section id="resultSection" class="result hidden">

      <div class="result-header">
        <h2>✅ Your Result</h2>
      </div>

      <div id="resultText" class="result-text"></div>

      <div class="result-actions">
        <button id="copyButton">📋 Copy</button>
        <button id="shareButton">📤 Share</button>
        <button id="newButton">🔄 New Task</button>
      </div>

    </section>

    <footer>
      <p>Free to use • More powerful features coming soon</p>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
